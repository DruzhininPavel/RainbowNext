name: Release

# A tag produces a GitHub release with a runnable archive per platform; a manual
# run only builds the same archives as workflow artifacts, so the packaging can
# be tried out without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # CMake seeds its own cache entry from this variable, so the matrix can
      # ask for a universal binary without quoting semicolons in the shell.
      CMAKE_OSX_ARCHITECTURES: ${{ matrix.osx_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One archive for both kinds of Mac. SDL3 is built from source, so the
          # cross compile costs nothing but the extra slice; CMake picks the
          # architectures up from CMAKE_OSX_ARCHITECTURES in the job environment.
          - name: macOS (Universal)
            os: macos-14
            slug: macos-universal
            osx_arch: arm64;x86_64
            setup: ""
          # The oldest runner still supported, so the archive also runs on newer
          # distributions: glibc is forward compatible, not backward.
          - name: Linux (x86_64)
            os: ubuntu-22.04
            slug: linux-x86_64
            osx_arch: ""
            setup: |
              sudo apt-get update
              sudo apt-get install -y build-essential ninja-build zip curl
              # SDL3 is always built from source here, and it needs the
              # X11/Wayland/audio headers to compile its backends.
              sudo apt-get install -y \
                libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
                libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
                libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
                libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
                libwayland-dev libdecor-0-dev libibus-1.0-dev
              # Ubuntu 22.04 ships CMake 3.22, the project needs 3.24.
              curl -sSL \
                https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz \
                | sudo tar -xz --strip-components=1 -C /usr/local

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: ${{ matrix.setup }}

      - name: Configure
        # RAINBOW_STATIC_SDL3 links SDL3 into the binary, so the archive needs
        # nothing installed on the user's machine beyond the system libraries.
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRAINBOW_STATIC_SDL3=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          ./build/rainbow --help
          if ldd build/rainbow 2>/dev/null | grep -qi sdl; then
            echo "rainbow still depends on a shared SDL library"; exit 1
          fi
          if otool -L build/rainbow 2>/dev/null | grep -qi sdl; then
            echo "rainbow still depends on a shared SDL library"; exit 1
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            archs=$(lipo -archs build/rainbow)
            echo "built for: ${archs}"
            for want in arm64 x86_64; do
              case " ${archs} " in
                *" ${want} "*) ;;
                *) echo "the binary has no ${want} slice"; exit 1 ;;
              esac
            done
          fi

      - name: Package
        run: |
          version=$(sed -n 's/^project(RainbowNext VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${version}-dev.${GITHUB_SHA:0:7}"
          fi
          name="rainbow-${version}-${{ matrix.slug }}"
          stage="stage/${name}"
          mkdir -p "${stage}/peripherals" "${stage}/roms" "${stage}/docs"
          cp build/rainbow "${stage}/"
          cp build/peripherals/* "${stage}/peripherals/"
          cp roms/README.md "${stage}/roms/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md "${stage}/"
          cp docs/*.md "${stage}/docs/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Finder cannot start a bare executable, and a downloaded one is
            # quarantined anyway, so ship a double-clickable wrapper as well.
            printf '#!/bin/sh\ncd "$(dirname "$0")" && exec ./rainbow "$@"\n' \
              > "${stage}/run-rainbow.command"
            chmod +x "${stage}/run-rainbow.command"
          fi
          mkdir -p dist
          (cd stage && zip -r -9 "../dist/${name}.zip" "${name}" >/dev/null)
          echo "PACKAGE=dist/${name}.zip" >> "${GITHUB_ENV}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Package an AppImage
        if: runner.os == 'Linux'
        # A single file the Steam Deck can run from anywhere: chmod +x and go.
        run: |
          name="rainbow-${VERSION}-${{ matrix.slug }}"
          appdir="stage/RainbowNext.AppDir"
          icons="${appdir}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${appdir}/usr/bin" "${appdir}/usr/share/applications" "${icons}"
          cp build/rainbow "${appdir}/usr/bin/"
          cp assets/rainbownext.png "${icons}/rainbownext.png"
          cp assets/rainbownext.png "${appdir}/rainbownext.png"
          cp assets/rainbownext.png "${appdir}/.DirIcon"
          cp packaging/rainbownext.desktop "${appdir}/"
          cp packaging/rainbownext.desktop "${appdir}/usr/share/applications/"
          cat > "${appdir}/AppRun" <<'APPRUN'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "${here}/usr/bin/rainbow" "$@"
          APPRUN
          chmod +x "${appdir}/AppRun"
          curl -sSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # The tool is itself an AppImage, and a bare runner has no FUSE.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            --no-appstream "${appdir}" "dist/${name}.AppImage"
          # Unpack the result and run what came out, so a broken image fails
          # here instead of on somebody's Steam Deck.
          "./dist/${name}.AppImage" --appimage-extract > /dev/null
          ./squashfs-root/usr/bin/rainbow --help > /dev/null
          rm -rf squashfs-root appimagetool
          echo "APPIMAGE=dist/${name}.AppImage" >> "${GITHUB_ENV}"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.slug }}
          # Only the finished archives, never the staging trees.
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          Ready-to-run builds of RainbowNext. Download the archive for your
          platform, unpack it anywhere and start the emulator from that folder:

          ```sh
          ./rainbow
          ```

          The macOS archive is universal, so the same file runs on Apple Silicon
          and on Intel Macs. `run-rainbow.command` does the same thing from
          Finder. If the system refuses to run the downloaded binary, clear the
          quarantine flag once with `xattr -d com.apple.quarantine rainbow`.

          On Linux there is also a single-file AppImage, which needs no unpacking:

          ```sh
          chmod +x rainbow-*.AppImage && ./rainbow-*.AppImage
          ```

          **The Spectrum ROMs are not included** — they are still under copyright.
          Put your own dumps into the `roms/` folder next to the executable (see
          `roms/README.md` for the file names), or open a ROM with
          *File -> Open ROM*.

          RainbowNext itself is BSD Zero Clause (0BSD): use it, change it, ship
          it, no conditions. SDL3 and Dear ImGui keep their own licenses, both
          reproduced in `THIRD-PARTY-NOTICES.md` inside the archive.

          The Linux builds need a running X11 or Wayland session and the usual
          audio libraries (`libasound2`, `libpulse`); SDL3 itself is linked in.
          NOTES
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "RainbowNext ${GITHUB_REF_NAME}" \
            --notes-file notes.md
