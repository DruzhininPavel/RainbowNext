name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            install: brew install sdl3
          - name: Linux (x86_64)
            os: ubuntu-24.04
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake build-essential ninja-build
              # SDL3 is fetched and built from source when the distro package is
              # missing, so the X11/Wayland/audio headers below are needed too.
              sudo apt-get install -y libsdl3-dev || echo "no system SDL3, building from source"
              sudo apt-get install -y \
                libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
                libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
                libxfixes-dev libxss-dev libxkbcommon-dev \
                libwayland-dev libdecor-0-dev libegl1-mesa-dev libgbm-dev

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
