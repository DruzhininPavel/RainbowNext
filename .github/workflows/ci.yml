name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            install: brew install sdl3
          - name: Linux (x86_64)
            os: ubuntu-24.04
            # SDL3 is fetched and built from source when the distro package is
            # missing, so a failure here is not fatal.
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake build-essential ninja-build || true
              sudo apt-get install -y libsdl3-dev || echo "no system SDL3, will fetch"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
